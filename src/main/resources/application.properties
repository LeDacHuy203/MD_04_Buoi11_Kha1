# ===============================================
# SERVER CONFIGURATION
# ===============================================
server.port=8080

# ===============================================
# DATASOURCE (POSTGRESQL)
# ===============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/medicine_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / HIBERNATE CONFIGURATION
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# ===============================================
# REDIS CACHE PROVIDER CONFIGURATION
# ===============================================
# Cau hinh Redis lam Cache Provider
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms

# Cache Redis settings
# TTL: 10 phut (600000 ms)
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=medicines::

# ===============================================
# LOGGING CONFIGURATION
# ===============================================
# Bat log SQL de kiem chung co che caching
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.cache=DEBUG
logging.level.com.medical.medicine=DEBUG

# ===============================================
# ACTUATOR & SWAGGER UI
# ===============================================
management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
